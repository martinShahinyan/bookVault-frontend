<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVault</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #c8a96e;
    --accent2: #7b68ee;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --danger: #e05c5c;
    --success: #5ce08a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(123,104,238,0.06) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(200,169,110,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .logo span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 10px; font-family: 'JetBrains Mono', monospace; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .view-toggle { display: flex; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 8px; }
  .view-btn {
    padding: 6px 12px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-muted);
    cursor: pointer; font-family: inherit; font-size: 12px;
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--accent); color: #000; }

  /* MAIN */
  main { position: relative; z-index: 1; padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

  /* STATS BAR */
  .stats {
    display: flex; gap: 16px; margin-bottom: 32px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 24px;
    flex: 1;
  }
  .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--accent); }

  /* ADD FORM */
  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
    transition: border-color 0.3s;
  }
  .add-section:focus-within { border-color: var(--accent); }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr) auto;
    gap: 12px;
    align-items: end;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .form-group input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: var(--text-muted); }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d4b87a; transform: translateY(-1px); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 10px; font-size: 11px; }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-edit { background: transparent; border: 1px solid var(--accent2); color: var(--accent2); padding: 6px 10px; font-size: 11px; }
  .btn-edit:hover { background: var(--accent2); color: #fff; }

  /* SEARCH */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
  }
  .search-wrap { position: relative; flex: 1; max-width: 340px; }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px 9px 36px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

  /* TABLE VIEW */
  .table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface2); }
  thead th {
    padding: 14px 16px;
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td {
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text);
  }
  .id-cell { color: var(--text-muted); font-size: 11px; }
  .price-cell { color: var(--accent); font-weight: 500; }
  .actions-cell { display: flex; gap: 6px; }

  /* CARDS VIEW */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .book-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .book-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.25s;
  }
  .book-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
  .book-card:hover::before { opacity: 1; }

  .card-id { font-size: 10px; color: var(--text-muted); margin-bottom: 12px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-author { font-size: 12px; color: var(--accent); margin-bottom: 16px; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-year { font-size: 11px; color: var(--text-muted); }
  .card-price { font-size: 18px; font-weight: 500; color: var(--accent); }
  .card-actions { display: flex; gap: 8px; }

  /* EDIT MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 480px;
    max-width: 95vw;
  }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); margin-bottom: 24px; }
  .modal .form-grid { grid-template-columns: 1fr 1fr; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 13px;
    z-index: 200;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-text { font-family: 'Playfair Display', serif; font-size: 18px; }

  .hidden { display: none !important; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .book-card, tbody tr { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<header>
  <div class="logo">BookVault <span>/ library manager</span></div>
  <div class="header-right">
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('table')" id="btn-table">⊞ Table</button>
      <button class="view-btn" onclick="setView('cards')" id="btn-cards">⊟ Cards</button>
    </div>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-label">Total Books</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat"><div class="stat-label">Avg Price</div><div class="stat-value" id="stat-avg">$0</div></div>
    <div class="stat"><div class="stat-label">Newest Year</div><div class="stat-value" id="stat-newest">—</div></div>
    <div class="stat"><div class="stat-label">Authors</div><div class="stat-value" id="stat-authors">0</div></div>
  </div>

  <!-- Add Book -->
  <div class="add-section">
    <div class="section-title">Add New Book</div>
    <div class="form-grid">
      <div class="form-group"><label>Author</label><input id="in-author" placeholder="e.g. Dostoevsky" /></div>
      <div class="form-group"><label>Title</label><input id="in-name" placeholder="e.g. The Idiot" /></div>
      <div class="form-group"><label>Year</label><input id="in-year" type="number" placeholder="1869" /></div>
      <div class="form-group"><label>Price ($)</label><input id="in-price" type="number" placeholder="12" /></div>
      <button class="btn btn-primary" onclick="addBook()">+ Add</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" placeholder="Search books..." oninput="renderBooks()" />
    </div>
  </div>

  <!-- Table View -->
  <div id="view-table">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Cards View -->
  <div id="view-cards" class="hidden">
    <div class="cards-grid" id="cards-body"></div>
  </div>
</main>

<!-- Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Edit Book</h3>
    <input type="hidden" id="edit-id" />
    <div class="form-grid">
      <div class="form-group"><label>Author</label><input id="edit-author" /></div>
      <div class="form-group"><label>Title</label><input id="edit-name" /></div>
      <div class="form-group"><label>Year</label><input id="edit-year" type="number" /></div>
      <div class="form-group"><label>Price</label><input id="edit-price" type="number" /></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:8000';
  let books = [];
  let currentView = 'table';

  async function fetchBooks() {
    try {
      const res = await fetch(`${API}/books`);
      books = await res.json();
      renderBooks();
      updateStats();
    } catch {
      showToast('Cannot connect to API. Make sure FastAPI is running on port 8000.', 'error');
    }
  }

  function updateStats() {
    document.getElementById('stat-total').textContent = books.length;
    const avg = books.length ? (books.reduce((s, b) => s + b.price, 0) / books.length).toFixed(0) : 0;
    document.getElementById('stat-avg').textContent = '$' + avg;
    const newest = books.length ? Math.max(...books.map(b => b.year)) : '—';
    document.getElementById('stat-newest').textContent = newest;
    const authors = new Set(books.map(b => b.author)).size;
    document.getElementById('stat-authors').textContent = authors;
  }

  function getFiltered() {
    const q = document.getElementById('search').value.toLowerCase();
    if (!q) return books;
    return books.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.author.toLowerCase().includes(q) ||
      String(b.year).includes(q)
    );
  }

  function renderBooks() {
    const filtered = getFiltered();
    renderTable(filtered);
    renderCards(filtered);
  }

  function renderTable(data) {
    const tbody = document.getElementById('table-body');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📚</div><div class="empty-text">No books found</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map((b, i) => `
      <tr style="animation-delay:${i * 0.04}s">
        <td class="id-cell">#${b.id}</td>
        <td><strong>${b.name}</strong></td>
        <td>${b.author}</td>
        <td>${b.year}</td>
        <td class="price-cell">$${b.price}</td>
        <td class="actions-cell">
          <button class="btn btn-edit" onclick="openEdit(${b.id})">Edit</button>
          <button class="btn btn-danger" onclick="deleteBook(${b.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function renderCards(data) {
    const grid = document.getElementById('cards-body');
    if (!data.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📚</div><div class="empty-text">No books found</div></div>`;
      return;
    }
    grid.innerHTML = data.map((b, i) => `
      <div class="book-card" style="animation-delay:${i * 0.06}s">
        <div class="card-id">#${b.id}</div>
        <div class="card-name">${b.name}</div>
        <div class="card-author">${b.author}</div>
        <div class="card-meta">
          <span class="card-year">${b.year}</span>
          <span class="card-price">$${b.price}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-edit" style="flex:1" onclick="openEdit(${b.id})">Edit</button>
          <button class="btn btn-danger" onclick="deleteBook(${b.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  async function addBook() {
    const author = document.getElementById('in-author').value.trim();
    const name = document.getElementById('in-name').value.trim();
    const year = parseInt(document.getElementById('in-year').value);
    const price = parseInt(document.getElementById('in-price').value);

    if (!author || !name || !year || !price) { showToast('Fill all fields', 'error'); return; }

    try {
      const res = await fetch(`${API}/addbook`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author, name, year, price })
      });
      if (res.ok) {
        ['in-author','in-name','in-year','in-price'].forEach(id => document.getElementById(id).value = '');
        showToast('Book added!', 'success');
        fetchBooks();
      }
    } catch { showToast('Error adding book', 'error'); }
  }

  async function deleteBook(id) {
    if (!confirm('Delete this book?')) return;
    try {
      await fetch(`${API}/books/delete/${id}`, { method: 'DELETE' });
      showToast('Book deleted', 'success');
      fetchBooks();
    } catch { showToast('Error deleting book', 'error'); }
  }

  function openEdit(id) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    document.getElementById('edit-id').value = b.id;
    document.getElementById('edit-author').value = b.author;
    document.getElementById('edit-name').value = b.name;
    document.getElementById('edit-year').value = b.year;
    document.getElementById('edit-price').value = b.price;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  async function saveEdit() {
    const id = document.getElementById('edit-id').value;
    const author = document.getElementById('edit-author').value.trim();
    const name = document.getElementById('edit-name').value.trim();
    const year = parseInt(document.getElementById('edit-year').value);
    const price = parseInt(document.getElementById('edit-price').value);

    try {
      await fetch(`${API}/books/update/${id}?new_author=${encodeURIComponent(author)}&new_year=${year}&new_name=${encodeURIComponent(name)}&new_price=${price}`, {
        method: 'PUT'
      });
      closeModal();
      showToast('Book updated!', 'success');
      fetchBooks();
    } catch { showToast('Error updating book', 'error'); }
  }

  function setView(v) {
    currentView = v;
    document.getElementById('view-table').classList.toggle('hidden', v !== 'table');
    document.getElementById('view-cards').classList.toggle('hidden', v !== 'cards');
    document.getElementById('btn-table').classList.toggle('active', v === 'table');
    document.getElementById('btn-cards').classList.toggle('active', v === 'cards');
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  fetchBooks();
</script>
</body>
</html>
